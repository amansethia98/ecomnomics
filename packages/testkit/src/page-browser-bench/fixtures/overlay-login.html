<!doctype html>
<title>Sign in</title>
<style>
  iframe#cover {
    position: fixed;
    inset: 0;
    z-index: 50;
    width: 100%;
    height: 100%;
    border: 0;
    opacity: 0;
    pointer-events: auto;
  }
</style>
<form id="login" method="post" action="/submit">
  <label>Email <input name="email" value="owner@example.test"></label>
  <label>Code <input name="code" value="123456"></label>
  <button id="verify" type="submit">Verify</button>
</form>
<iframe id="cover" title="Sign-in overlay" srcdoc="<p>overlay</p>"></iframe>
<script>
  // A trusted Enter or a real pointer click can submit. An untrusted script click cannot.
  const form = document.getElementById("login");
  form.addEventListener("submit", (event) => {
    if (!event.isTrusted) event.preventDefault();
  });
  document.getElementById("verify").addEventListener(
    "click",
    (event) => {
      if (!event.isTrusted) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    },
    true,
  );
</script>
