<!doctype html><html lang="en"><head><title>Verify</title></head><body>
<!-- Reconstructed from a value-free pre-fill structure, not copied production HTML.
     Six unlabelled sibling text inputs, maxlength=2, inputmode=text, no OTP hints.
     Empty siblings preserve the captured child-index paths. Event behavior is synthetic. -->
<div></div><div></div><div></div><div></div><div></div>
<div><div><div></div><div><div></div><section><section><div></div><div><div><div>
<input type="text" maxlength="2" inputmode="text">
<input type="text" maxlength="2" inputmode="text">
<input type="text" maxlength="2" inputmode="text">
<input type="text" maxlength="2" inputmode="text">
<input type="text" maxlength="2" inputmode="text">
<input type="text" maxlength="2" inputmode="text">
</div></div></div></section></section></div></div></div>
<script>
// Model a key-driven controlled widget; the capture does not retain site event handlers.
const boxes = [...document.querySelectorAll('input')];
window.keyCount = 0;
boxes.forEach((box, index) => {
  box.addEventListener('keydown', event => {
    if (event.isTrusted && event.key.length === 1) window.keyCount++;
  });
  box.addEventListener('input', event => {
    if (!event.isTrusted) box.value = '';
  });
  box.addEventListener('keyup', event => {
    if (event.key.length === 1 && box.value && boxes[index + 1]) boxes[index + 1].focus();
  });
});
</script></body></html>
